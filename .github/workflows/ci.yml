name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24.11.1', cache: npm, cache-dependency-path: ui/package-lock.json}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: engine/pom.xml}
      - uses: actions/setup-go@v5
        with: {go-version: '1.24.9', cache: false}
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.15.9'}
      - uses: azure/setup-helm@v4.3.1
        with: {version: 'v3.19.0'}
      - run: python -m pip install -r tools/requirements.txt -r ml/requirements.txt
      - run: make test-python
      - run: sudo apt-get update && sudo apt-get install -y clang libbpf-dev pkg-config
      - run: make test-agent
      - run: ./mvnw -B -ntp verify
        working-directory: engine
      - run: go test ./...
        working-directory: tools/eventstorm
      - run: npm ci && npm test && npm run build
        working-directory: ui
      - run: make test-config
      - run: |
          terraform fmt -check -recursive deploy/terraform
          for directory in deploy/terraform deploy/terraform/azure; do
            terraform -chdir="$directory" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$directory" validate
          done
      - run: make test-helm
  integration:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make integration
  images:
    needs: [checks, integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {component: engine, context: engine}
          - {component: ui, context: ui}
          - {component: eventstorm, context: tools/eventstorm}
          - {component: agent, context: agent}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lowercase GHCR owner
        id: owner
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ steps.owner.outputs.name }}/cross-node-ids-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
