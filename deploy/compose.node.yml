name: cross-node-sensor
services:
  # Explicit profile; validate kernel hooks/capabilities/seccomp on the VM.
  agent:
    profiles: [agent]
    image: ${AGENT_IMAGE:-cross-node-ids-agent:dev}
    restart: unless-stopped
    pid: host
    network_mode: host
    privileged: false
    cap_drop: [ALL]
    cap_add: [BPF, PERFMON]
    ulimits:
      memlock: {soft: 16777216, hard: 16777216}
    security_opt: [no-new-privileges:true]
    read_only: true
    environment:
      NODE_ID: ${NODE_ID:?Set NODE_ID}
      ARGUMENT_POLICY: redact
      OUTPUT_PATH: /var/log/agent/events.jsonl
    volumes:
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - ./deploy/logs:/var/log/agent
    tmpfs: [/tmp]
  fluent-bit:
    image: fluent/fluent-bit:4.0.3
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Set TLS broker host:9094}
    volumes:
      - ./deploy/fluent-bit.tls.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./deploy/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./deploy/logs:/var/log/agent:ro
      - ${TLS_DIR:-./deploy/tls}/${NODE_ID}:/run/tls:ro
      - fluent-bit-state:/fluent-bit/state
volumes:
  fluent-bit-state:
