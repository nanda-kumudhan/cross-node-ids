[SERVICE]
    Flush                     1
    Log_Level                 info
    Parsers_File              /fluent-bit/etc/parsers.conf
    storage.path              /fluent-bit/state/storage
    storage.sync              normal

[INPUT]
    Name                      tail
    Tag                       agent
    Path                      /var/log/agent/*.jsonl
    Parser                    event_json
    DB                        /fluent-bit/state/tail.db
    Read_from_Head            On
    Refresh_Interval          1
    storage.type              filesystem

[OUTPUT]
    Name                      kafka
    Match                     agent
    Brokers                   ${KAFKA_BOOTSTRAP_SERVERS}
    Topics                    events.raw
    Format                    json
    Message_Key_Field         node
    Retry_Limit               False
    queue_full_retries        0
    storage.total_limit_size  1G
    rdkafka.enable.idempotence true
    rdkafka.request.required.acks -1
