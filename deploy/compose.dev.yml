name: cross-node-ids

services:
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_PORT:-29092}:29092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for topic in events.raw alerts metrics.loss; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done

  fluent-bit:
    image: fluent/fluent-bit:4.0.3
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./deploy/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./deploy/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./deploy/logs:/var/log/agent:ro
      - fluent-bit-state:/fluent-bit/state

  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ids}
      POSTGRES_USER: ${POSTGRES_USER:-ids}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ids-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  engine:
    profiles: [app]
    build: ./engine
    image: cross-node-ids-engine:dev
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ids}
      POSTGRES_USER: ${POSTGRES_USER:-ids}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ids-local-only}
      IDS_DETECTION_ENABLED: ${IDS_DETECTION_ENABLED:-true}
    ports:
      - "127.0.0.1:${ENGINE_PORT:-8080}:8080"
    volumes:
      - ./rules:/app/rules:ro

  ui:
    profiles: [app]
    build: ./ui
    image: cross-node-ids-ui:dev
    restart: unless-stopped
    depends_on: [engine]
    ports:
      - "127.0.0.1:${UI_PORT:-8088}:8080"

  agent:
    profiles: [agent]
    build: ./agent
    image: cross-node-ids-agent:dev
    pid: host
    network_mode: host
    cap_drop: [ALL]
    cap_add: [BPF, PERFMON]
    ulimits:
      memlock: {soft: 16777216, hard: 16777216}
    security_opt: [no-new-privileges:true]
    read_only: true
    environment:
      NODE_ID: ${NODE_ID:-local-node}
      OUTPUT_PATH: /var/log/agent/events.jsonl
    volumes:
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - ./deploy/logs:/var/log/agent
    tmpfs: [/tmp]

volumes:
  kafka-data:
  postgres-data:
  fluent-bit-state:
